version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pack-calculator:latest
    container_name: pack-calculator
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
